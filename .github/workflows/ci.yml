# Intégration continue [T-10] : chaque PR et chaque push sur main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, types, tests, équilibrage, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Node 24 : même version majeure que l'environnement d'exécution Vercel.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Données du questionnaire
        run: npm run validate

      - name: Tests et couverture (dont équilibrage C1 à C6)
        run: npm run test:coverage

      - name: Rapport d'équilibrage
        run: npm run balance

      - name: Build
        run: npm run build

      - name: Navigateurs des tests de bout en bout (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Tests de bout en bout (4 langues, 5 navigateurs, accessibilité)
        run: npm run test:e2e

      - name: Traces Playwright en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

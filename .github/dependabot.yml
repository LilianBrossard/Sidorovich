# Dépendances surveillées [T-11] : une PR par semaine au plus par écosystème, regroupée.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Majeures écartées (PR 12 à 14, 16/11/2026) :
    # - TypeScript et ESLint : pas encore pris en charge par typescript-eslint et les
    #   extensions d'eslint-config-next ; à rouvrir quand Next.js les acceptera.
    # - @types/node : suit la version minimale de Node du projet (22, champ engines).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
